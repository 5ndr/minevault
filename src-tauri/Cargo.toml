[package]
name = "resticdashboard"
version = "0.1.1"
description = "Cross-platform portable restic backup manager"
authors = ["Antigravity"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "resticdashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
dirs = "7.0.0"
walkdir = "2.5.0"
regex = "1.13.1"
libc = "0.2.191"
rfd = "0.18.0"
aes-gcm = "0.10"
sha2 = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac", "sha2"] }
getrandom = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
